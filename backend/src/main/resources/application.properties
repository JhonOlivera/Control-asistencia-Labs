spring.application.name=control-asistencia

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-e54d5cb-jhonedwinolivera2018-2d8d.k.aivencloud.com}:${DB_PORT:25600}/${DB_NAME:defaultdb}?sslMode=REQUIRED
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend-url=http://localhost:4200
app.token.expiracion-minutos=120
app.asistencia.minutos-tolerancia=15